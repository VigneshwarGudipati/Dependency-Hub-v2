services:
  postgres:
    image: postgres:16
    container_name: dependencyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dependencyhub
      POSTGRES_USER: dependencyhub
      POSTGRES_PASSWORD: dependencyhub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dependencyhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dependencyhub -d dependencyhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dependencyhub_postgres_data: