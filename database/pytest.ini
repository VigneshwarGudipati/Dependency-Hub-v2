[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = backend
# Both test suites require a live PostgreSQL connection.
# DB-layer tests (tests/):          SQLAlchemy async sessions with per-test rollback
# API-layer tests (backend/tests/): FastAPI TestClient + seeded data
testpaths = tests
norecursedirs = tests/integration
